/* ===== Projeto 3.0 v2.2 — user panel matching the approved visual ===== */
.user-shell-v22{
  width:min(1180px,100%);
  margin:0 auto;
  padding:16px 18px 12px;
}
.user-top-v22{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  border-bottom:1px solid #087db2;
  padding:0 0 14px;
}
.user-brand-wrap{
  display:flex;
  align-items:center;
  min-width:0;
}
.brand-ghost{
  width:78px;
  height:78px;
  object-fit:cover;
  object-position:center top;
  border-radius:18px;
  margin-right:10px;
  mix-blend-mode:screen;
  filter:drop-shadow(0 0 13px rgba(0,200,255,.55));
}
.brand-large{font-size:29px}
.user-profile{min-width:210px}
.user-profile strong{
  display:block;
  color:#eaffff;
  font-size:13px;
}
.profile-icon{font-size:27px;color:#2ad9ff}
.hero-v22{
  min-height:205px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(7,89,126,.35);
  background:
    radial-gradient(circle at 77% 55%,rgba(0,194,255,.22),transparent 28%),
    linear-gradient(180deg,rgba(0,0,0,0),rgba(0,18,30,.2));
}
.hero-copy{padding-left:42px}
.hero-copy h2{
  color:#2bdfff;
  font-size:29px;
  margin:0 0 9px;
  letter-spacing:.01em;
}
.hero-copy p{
  color:#91cbed;
  line-height:1.48;
  font-size:15px;
}
.hero-ghost-img{
  width:390px;
  height:230px;
  object-fit:cover;
  object-position:center 37%;
  mix-blend-mode:screen;
  filter:drop-shadow(0 0 24px rgba(0,180,255,.28));
  margin-right:5px;
}
.user-grid-v22{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px;
}
.user-card-v22{
  min-height:0;
  padding:20px;
  border-radius:10px;
  border:1px solid #0ca5e4;
  background:
    radial-gradient(circle at 90% 0%,rgba(0,185,255,.07),transparent 32%),
    linear-gradient(180deg,rgba(5,26,44,.98),rgba(2,16,29,.98));
}
.card-title-row{
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin-bottom:16px;
}
.card-title-row h2{
  font-size:18px;
  letter-spacing:.08em;
  margin:0 0 6px;
}
.card-title-row p{
  color:#82c3df;
  font-size:12px;
  line-height:1.45;
  margin:0;
}
.title-icon{
  color:#13d7ff;
  font-size:34px;
  line-height:1;
  text-shadow:0 0 15px rgba(0,208,255,.35);
}
.send-icon{font-size:36px}
.connected-v22,.authorized-v22,.sessions-v22,.banner-v22,.hint-box{
  border-color:#0a76a4;
  background:#03131f;
  border-radius:8px;
}
.connected-v22{padding:12px;margin-top:10px}
.connected-v22 h4,.authorized-v22 h4,.sessions-v22 h4{
  font-size:12px;
}
.wa-row{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:8px;
  align-items:center;
  padding-top:10px;
}
.wa-check{color:#48ef91}
.wa-row strong{display:block;font-size:11px}
.wa-row small{display:block;color:#6c9db3;font-size:9px;margin-top:2px}
.online-label{font-size:9px}
.authorized-v22{padding:12px;margin-top:8px}
.authorized-v22 .panel-head{margin-bottom:4px}
.authorized-v22 .panel-head>span{color:#92dfff;font-size:10px}
.authorized-row{
  border-top:1px solid #07364d;
  padding:8px 0;
  color:#bdefff;
  font-size:10px;
}
.hint-box{
  margin-top:10px;
  padding:11px;
  color:#72a4b9;
  font-size:9px;
  line-height:1.45;
}
.send-v22 label{
  font-size:12px;
  color:#d8f7ff;
  margin-top:4px;
}
.target-input{
  padding:12px 13px!important;
  font-size:12px!important;
  margin-top:4px;
  border-radius:8px!important;
}
.start-btn{
  min-height:50px;
  font-size:14px;
  margin-top:10px!important;
}
.sessions-v22{
  padding:10px 12px;
  margin-top:12px;
}
.sessions-v22 .panel-head{
  margin-bottom:4px;
}
.session-row-v22{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:1px solid #07364d;
  padding:8px 2px;
  color:#bff4ff;
  font-size:10px;
}
.cancel{
  min-width:28px;
  padding:4px 8px;
  background:#2b0610;
  color:#ff596d;
  border:1px solid #ff304b;
  border-radius:5px;
  font-weight:800;
}
.banner-v22{
  margin-top:12px;
  overflow:hidden;
  height:176px;
}
.banner-v22 img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  opacity:.94;
}
.bottom-nav-v22{
  margin-top:13px;
}
.footer-v22{
  padding:11px 2px 2px;
  color:#5e94a8;
  font-size:9px;
  display:flex;
  justify-content:space-between;
}
@media (max-width:1000px){
  .user-shell-v22{padding:12px}
  .hero-v22{min-height:170px}
  .hero-copy{padding-left:12px}
  .hero-copy h2{font-size:23px}
  .hero-ghost-img{width:285px;height:180px}
  .user-grid-v22{grid-template-columns:1fr}
}
@media (max-width:620px){
  .user-top-v22{align-items:flex-start}
  .brand-ghost{width:54px;height:54px}
  .brand-large{font-size:21px}
  .subbrand{font-size:9px}
  .user-profile{min-width:145px;padding:6px 8px}
  .hero-v22{min-height:150px}
  .hero-ghost-img{width:210px;height:150px}
  .hero-copy{padding-left:6px}
  .hero-copy h2{font-size:20px}
  .hero-copy p{font-size:12px}
  .user-card-v22{padding:14px}

/* v2.4 mobile refinements */
@media (max-width: 600px) {
  .user-shell-v22 { padding: 10px; }
  .user-top-v22 { align-items: flex-start; flex-wrap: wrap; }
  .brand-large { font-size: 22px; }
  .brand-ghost { width: 54px; height: 54px; margin-right: 8px; }
  .user-profile { min-width: 0; width: 100%; }
